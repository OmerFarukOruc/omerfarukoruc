name: Redraw the profile panels
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/redraw.yml
      - scripts/**
      - data/profile.json
concurrency:
  group: redraw-${{ github.ref }}
jobs:
  redraw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the counts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch.py
      - name: Draw the panels
        shell: bash
        run: python3 scripts/bench.py assets README.md
      - name: Commit the panels
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activity.json assets README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: redraw the profile panels"
          git push || { git pull --rebase origin "${GITHUB_REF_NAME}" && git push; }
